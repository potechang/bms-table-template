
<!DOCTYPE html>
<html lang="ja">

<head>
    <title>ポテチャグjoy</title>
    <meta charset="UTF-8">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bmstable" content="header.json" />
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'M PLUS Rounded 1c', sans-serif;

    /* 星レイヤー + ピンクグラデ */
    background:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 100px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 150px 40px, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 60px 120px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 200px 150px, rgba(255,255,255,0.6), transparent),
        linear-gradient(180deg, #fff0f6 0%, #ffeef8 100%);

    background-size:
        250px 250px,
        300px 300px,
        350px 350px,
        280px 280px,
        320px 320px,
        100% 100%;
}

/* ナビバー */
.navbar {
    background: #ff9ecf !important;
}

.navbar-brand {
    font-weight: 700;
    font-size: 1.5rem;
}

/* 上部説明ボックス */
.alert {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(255, 150, 200, 0.2);
    border: none;
}

/* テーブル */
.table {
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(255, 150, 200, 0.15);
}

.table thead {
    background-color: #ffb6d9 !important;
    color: white;
}

.table-striped tbody tr:nth-of-type(odd) {
    background-color: #fff5fa;
}

.table-hover tbody tr:hover {
    background-color: #ffd6ec !important;
    transition: 0.2s;
}

/* リンク */
a {
    color: #ff4fa3;
    text-decoration: none;
}

a:hover {
    color: #ff0088;
    text-decoration: underline;
}

td, th {
    vertical-align: middle !important;
}

.container {
    margin-top: 30px;
}
</style>



</head>

<body>
    <header class="mb-3">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">ポテチャグjoy</span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>BMS自作差分まとめ (obj:potechang 等)</p>
            <p>意図的にキー音を加えたりしている差分が多いので苦手な方は注意</p>
            <p>何かあればTwitterの方に連絡ください:<a href="https://twitter.com/pt10_">@pt10_</a> </p>
            <hr>
            <p class="mb-0">sl0~6=pt-2 sl7~12=pt-1 / pt0からはst基準 </p>
            <p class="mb-0"><a href="https://drive.google.com/drive/folders/1bMsulUo7aR5hfAYM8J9fNxfVJJ6DYBKy?usp=sharing">差分と段位(googleドライブ)</a></p>
        </div>


        <!--ここから難易度表本体-->
        <div>
            <table class="table table-light table-striped table-hover table-sm" id="table_int">
            </table>
        </div>
        <script language="javascript" type="text/javascript">
            $(document).ready(function () {
                $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {
                    $.getJSON(header.data_url, function (information) {
                        makeBMSTable(information, header.symbol);
                    });
                });
            });

            function makeBMSTable(info, mark) {
                var x = "";
                var ev = "";
                var count = 0;
                var obj = $("#table_int");


                obj.html("");
                $("<thead class='table-dark'><tr><th>Level</th><th>Title</th><th>Artist</th><th>BPM</th><th>Notes</th><th>T/N</th><th>本体</th><th>差分</th><th>譜面</th><th>Comment</th></tr></thead><tbody>")
                    .appendTo(obj);
                var obj_sep = null;
                
                for (var i = 0; i < info.length; i++) {
                    if (x != info[i].level) {
                        obj_sep = $("<tr style='text-align:center' id='" + mark + info[i].level +
                            "'></tr>");
                        obj_sep.appendTo(obj);
                        count = 0;
                        x = info[i].level;
                    }
                    var str = $("<tr></tr>");


                    // Level
                    $("<td width='5%'>" + mark + x + "</td>").appendTo(str);

                    // Title
                    $("<td width='25%'>" +
                        "<a href='http://www.dream-pro.info/~lavalse/LR2IR/search.cgi?mode=ranking&bmsmd5=" + info[
                            i]
                        .md5 + "' target='_blank'>" + info[i].title + "</a></td>").appendTo(str);

                    // Artist
                    $("<td width='20%'>" + info[i].artist + "</td>").appendTo(str);

                    // BPM
                    $("<td width='5%'>" + info[i].BPM+ "</td>").appendTo(str);

                    // Notes
                    $("<td width='5%'>" + info[i].Notes + "</td>").appendTo(str);

                    // T/N比
                    $("<td width='5%'>" + info[i].TN + "</td>").appendTo(str);

                    // 本体DL
                    $("<td width='5%'>" +
                        "<a href='" + info[i].url + "' target='_blank'>" + "本体" + "</a></td>").appendTo(str);
                    
                    // 差分DL
                    $("<td width='5%'>" +
                    (info[i].url_diff && info[i].url_diff.trim() !== ""
                    ? "<a href='" + info[i].url_diff + "' target='_blank'>差分</a>"
                    : "") +
                    "</td>"
                    ).appendTo(str);

                    
                    // Chartview
                    $("<td width='5%'>" +
                        "<a href='https://bms-score-viewer.pages.dev/view?md5=" + info[
                            i]
                        .md5 + "' target='_blank'>" + "view" + "</a></td>").appendTo(str);
                    
                    // Comment
                    $("<td width='20%'>" + info[i].comment + "</td>").appendTo(str);
                    str.appendTo(obj);
                    count++;

                }
                $("</tbody>").appendTo(obj);
                
            }
        </script>
    </div>

</html>
